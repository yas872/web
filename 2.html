<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questão 5</title>
</head>
<style>
        
        body {
            padding-top: 50px;
        }

        
        .botao {
            padding: 20px 40px;
            font-size: 20px;
            background-color: orange;
            border: none;
            cursor: pointer;
            
            
            animation: mudarCor 3s infinite; 
        }

        
        .botao:hover {
            background-color: black;
            color: white;
        }

        
        @keyframes mudarCor {
            0% { background-color: orange; }
            50% { background-color: yellow; }
            100% { background-color: orange; }
        }
    </style>
</head>
<body>

    <header>
        <h1>CSS</h1>
    </header>

    <main>
        <p>animação e efeito de mouse super radical einteressante</p>
        
        <button class="botao">passa o mouse</button>
    </main>

</body>
</html>
