<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>questao 5b</title>
<style>
    body{
        margin: 0;
    }

    .container{
        display: grid;
        height: 100vh;
        width: 100vw;
        gap: 5px;

        grid-template-columns: 2fr 2fr 2fr 2fr 1fr;
        grid-template-rows: 1fr 1fr 1fr;

        grid-template-areas:
        "a a b c c"
        "d d b e circulo"
        "f f f e circulo";
    }

    

    #bx1{ grid-area: a; background-color: orange; }
    #bx2{ grid-area: b; background-color: yellow; }
    #bx3{ grid-area: c; background-color: lightblue; }
    #bx4{ grid-area: d; background-color: blue; }
    #bx5{ grid-area: e; background-color: lightgreen; }
    #bx6{ grid-area: f; background-color: orange; }
    .bolas{
        grid-area: circulo;
        display: flex;
        flex-direction: column;
        justify-content: space-around;
        align-items: center;
    }

    .ball{
        width: 39px;
        height: 40px;
        border-radius: 50%;
    }

    #b1{ background-color: yellow; }
    #b2{ background-color: purple; }
    #b3{ background-color: green; }
    #b4{ background-color: blue; }

    @media (max-width:600px) {
        .container{
        display: grid;
        height: 100vh;
        grid-template-areas: "a b"
                             "a b"
                             "d d "
                             "e circulo";
        
        grid-template-columns: 2fr 2fr;
        grid-template-rows: 1fr 1fr 1fr 1fr;

        }
    } 

</style>
</head>

<body>

<div class="container">
    <div class="box" id="bx1"></div>
    <div class="box" id="bx2"></div>
    <div class="box" id="bx3"></div>
    <div class="box" id="bx4"></div>
    <div class="box" id="bx5"></div>
    <div class="box" id="bx6"></div>

    <div class="bolas">
        <div class="ball" id="b1"></div>
        <div class="ball" id="b2"></div>
        <div class="ball" id="b3"></div>
        <div class="ball" id="b4"></div>
</div>
    
</body>
</html>
